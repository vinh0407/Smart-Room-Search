<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Demand Posting Flow (Cascading Form)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body {
  margin: 0;
  font-family: var(--font-sans, "Plus Jakarta Sans", system-ui, sans-serif);
  background-color: var(--surface-base, #f7f7f5);
  color: var(--ink-primary, #1c1917);
  -webkit-font-smoothing: antialiased;
}
* {
  box-sizing: border-box;
}
.modal-frame {
  width: 760px;
  height: 660px;
  background: #ffffff;
  border-radius: 20px;
  border: 1px solid #e7e5e4;
  box-shadow: 0 16px 36px -6px rgba(0,0,0,0.12);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-top {
  padding: 18px 24px;
  border-bottom: 1px solid #e7e5e4;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-title {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
}
.form-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.section-title {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  color: #ea580c;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.cascading-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-label {
  font-size: 12px;
  font-weight: 700;
  color: #44403c;
}
.form-select, .form-input {
  height: 42px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid #e7e5e4;
  background: #f5f5f4;
  font-size: 13px;
  font-weight: 600;
  color: #1c1917;
  outline: none;
}
.form-select:focus, .form-input:focus {
  border-color: #ea580c;
  background: #ffffff;
}
.amenities-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.amenity-toggle {
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid #e7e5e4;
  background: #f5f5f4;
  font-size: 12px;
  font-weight: 600;
  color: #57534e;
  cursor: pointer;
}
.amenity-toggle.checked {
  background: #fff7ed;
  border-color: #ea580c;
  color: #ea580c;
  font-weight: 700;
}
.modal-bottom {
  padding: 16px 24px;
  border-top: 1px solid #e7e5e4;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  background: #fafaf9;
}
.btn-cancel {
  background: #ffffff;
  border: 1px solid #e7e5e4;
  color: #57534e;
  height: 42px;
  padding: 0 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.btn-submit {
  background: #ea580c;
  color: #ffffff;
  border: none;
  height: 42px;
  padding: 0 24px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
</style>
</helmet>

<div class="modal-frame">
  <!-- Modal Top -->
  <div class="modal-top">
    <div>
      <h2 class="modal-title">Đăng nhu cầu tìm phòng</h2>
      <span style="font-size:12px; color:#78716c;">Hệ thống sẽ thông báo ngay khi có phòng phù hợp</span>
    </div>
    <div style="cursor:pointer; color:#a8a29e;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </div>
  </div>

  <!-- Form Content -->
  <div class="form-content">
    <!-- Area filter -->
    <div>
      <div class="section-title">1. Khu vực mong muốn (Lọc đa cấp)</div>
      <div class="cascading-grid">
        <div class="form-group">
          <label class="form-label">Tỉnh / Thành phố *</label>
          <select class="form-select">
            <option selected>TP. Hồ Chí Minh</option>
            <option>Hà Nội</option>
            <option>Đà Nẵng</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Quận / Huyện *</label>
          <select class="form-select">
            <option selected>Quận 10</option>
            <option>Quận 1</option>
            <option>Quận Bình Thạnh</option>
            <option>Quận Tân Bình</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Phường / Xã</label>
          <select class="form-select">
            <option selected>Phường 14</option>
            <option>Phường 12</option>
            <option>Tất cả phường</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Budget & Move-in -->
    <div>
      <div class="section-title">2. Ngân sách & Thời gian</div>
      <div class="cascading-grid">
        <div class="form-group">
          <label class="form-label">Ngân sách tối đa</label>
          <input class="form-input" type="text" value="4.500.000 đ/tháng">
        </div>
        <div class="form-group">
          <label class="form-label">Ngày dự kiến dọn vào</label>
          <input class="form-input" type="date" value="2026-11-15">
        </div>
        <div class="form-group">
          <label class="form-label">Số người ở</label>
          <select class="form-select">
            <option>1 người</option>
            <option selected>2 người</option>
            <option>3+ người</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Amenities -->
    <div>
      <div class="section-title">3. Tiện ích bắt buộc</div>
      <div class="amenities-pills">
        <div class="amenity-toggle checked">Có máy lạnh</div>
        <div class="amenity-toggle checked">WC khép kín</div>
        <div class="amenity-toggle checked">Giờ giấc tự do</div>
        <div class="amenity-toggle">Có ban công</div>
        <div class="amenity-toggle">Gác lửng</div>
        <div class="amenity-toggle">Chỗ để xe máy</div>
        <div class="amenity-toggle">Thang máy</div>
      </div>
    </div>

    <!-- Contact Info -->
    <div>
      <div class="section-title">4. Thông tin liên hệ</div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label">Họ và tên *</label>
          <input class="form-input" type="text" placeholder="Nguyễn Văn A">
        </div>
        <div class="form-group">
          <label class="form-label">Số điện thoại / Zalo *</label>
          <input class="form-input" type="text" placeholder="09xx xxx xxx">
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom CTA -->
  <div class="modal-bottom">
    <button class="btn-cancel">Hủy</button>
    <button class="btn-submit">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span>Đăng nhu cầu ngay</span>
    </button>
  </div>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
