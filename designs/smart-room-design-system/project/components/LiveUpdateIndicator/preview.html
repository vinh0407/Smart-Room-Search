<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
body {
  margin: 0;
  padding: 18px 24px;
  background-color: var(--surface-card, #ffffff);
  font-family: var(--font-sans, "Plus Jakarta Sans", system-ui, sans-serif);
  display: flex;
  align-items: center;
  gap: 16px;
  box-sizing: border-box;
}
.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  padding: 6px 14px;
  border-radius: var(--radius-full, 9999px);
  font-size: 13px;
  font-weight: 600;
  color: #166534;
}
.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #16a34a;
  box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(22, 163, 74, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
}
.refresh-btn {
  background: var(--surface-muted, #f5f5f4);
  border: 1px solid var(--border-subtle, #e7e5e4);
  color: var(--ink-primary, #1c1917);
  height: 34px;
  padding: 0 12px;
  border-radius: var(--radius-sm, 8px);
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.refresh-btn:hover {
  background: #e7e5e4;
}
.refresh-icon {
  width: 14px;
  height: 14px;
}
</style>
</head>
<body>
  <div class="live-pill">
    <span class="pulse-dot"></span>
    <span>Tự động cập nhật: 15:05</span>
  </div>
  <button class="refresh-btn">
    <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
    </svg>
    <span>Làm mới ngay</span>
  </button>
</body>
</html>
