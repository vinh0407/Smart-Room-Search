<!-- @dsCard group="Badges" height=80 -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
body {
  margin: 0;
  padding: 20px;
  background-color: var(--surface-card, #ffffff);
  font-family: var(--font-sans, "Plus Jakarta Sans", system-ui, sans-serif);
  display: flex;
  align-items: center;
  gap: 12px;
  box-sizing: border-box;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-full, 9999px);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border: 1px solid transparent;
}
.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.badge-local {
  background: rgba(16, 185, 129, 0.12);
  color: #059669;
  border-color: rgba(16, 185, 129, 0.25);
}
.badge-local .badge-dot { background: #10b981; }

.badge-nhatot {
  background: rgba(234, 88, 12, 0.12);
  color: #c2410c;
  border-color: rgba(234, 88, 12, 0.25);
}
.badge-nhatot .badge-dot { background: #ea580c; }

.badge-bds {
  background: rgba(29, 78, 216, 0.12);
  color: #1d4ed8;
  border-color: rgba(29, 78, 216, 0.25);
}
.badge-bds .badge-dot { background: #2563eb; }

.badge-pt123 {
  background: rgba(21, 128, 61, 0.12);
  color: #15803d;
  border-color: rgba(21, 128, 61, 0.25);
}
.badge-pt123 .badge-dot { background: #16a34a; }
</style>
</head>
<body>
  <div class="badge badge-local"><span class="badge-dot"></span>Chính chủ</div>
  <div class="badge badge-nhatot"><span class="badge-dot"></span>Chợ Tốt Nhà</div>
  <div class="badge badge-bds"><span class="badge-dot"></span>Batdongsan</div>
  <div class="badge badge-pt123"><span class="badge-dot"></span>Phongtro123</div>
</body>
</html>
